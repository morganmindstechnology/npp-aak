<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NPP A.A.K. Admin Dashboard</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#061d4f;color:#fff;padding:18px}main{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:18px;margin-bottom:16px}input,select{padding:10px;border:1px solid #cbd5e1;border-radius:8px;width:100%;margin:6px 0 12px}button{padding:10px 14px;border:0;border-radius:8px;background:#e51c2a;color:#fff;cursor:pointer}.secondary{background:#063b91}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.stat{font-size:28px;font-weight:700;color:#063b91}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
window.NPP_CONFIG = {
  SUPABASE_URL: "https://yncyalldtpypypzaddpn.supabase.co",
  SUPABASE_PUBLISHABLE_KEY: "sb_publishable_JBlwZOw3MdT487Wlp7x5lw_Qae3SNCB"
};
</script>

</head>
<body>
<header><h1>NPP A.A.K. — Admin Dashboard</h1><p>Membership, branches, news, events and messages</p></header>
<main>
<div id="login" class="card">
<h2>Administrator Login</h2>
<label>Email<input id="email" type="email"></label>
<label>Password<input id="password" type="password"></label>
<button onclick="login()">Sign in</button><p id="loginMsg"></p>
</div>

<div id="app" class="hidden">
<div class="card"><button class="secondary" onclick="logout()">Sign out</button></div>
<div class="grid">
<div class="card"><div class="stat" id="memberCount">—</div><div>Membership applications</div></div>
<div class="card"><div class="stat" id="pendingCount">—</div><div>Pending applications</div></div>
<div class="card"><div class="stat" id="messageCount">—</div><div>Contact messages</div></div>
</div>

<div class="card">
<h2>Membership Applications</h2>
<button onclick="loadMembers()">Refresh</button>
<div style="overflow:auto"><table><thead><tr><th>Application</th><th>Name</th><th>Phone</th><th>Status</th><th>Submitted</th><th>Action</th></tr></thead><tbody id="members"></tbody></table></div>
</div>

<div class="card">
<h2>Add News</h2>
<label>Title<input id="newsTitle"></label>
<label>Summary<input id="newsSummary"></label>
<label>Body<input id="newsBody"></label>
<button onclick="addNews()">Publish News</button><p id="newsMsg"></p>
</div>
</div>
</main>
<script>
let sb;
function init(){
 if(!window.NPP_CONFIG||window.NPP_CONFIG.SUPABASE_URL.includes('YOUR-PROJECT')){document.getElementById('loginMsg').textContent='Complete config.js first.';return false;}
 sb=supabase.createClient(window.NPP_CONFIG.SUPABASE_URL,window.NPP_CONFIG.SUPABASE_PUBLISHABLE_KEY);return true;
}
async function login(){
 const email=document.getElementById('email').value,password=document.getElementById('password').value;
 const {error}=await sb.auth.signInWithPassword({email,password});
 document.getElementById('loginMsg').textContent=error?error.message:'Signed in.';
 if(!error) await check();
}
async function check(){
 const {data:{user}}=await sb.auth.getUser(); if(!user)return;
 const {data:role}=await sb.from('admin_roles').select('role').eq('user_id',user.id).single();
 if(!role){document.getElementById('loginMsg').textContent='This account is not an administrator.';await sb.auth.signOut();return;}
 document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadAll();
}
async function logout(){await sb.auth.signOut();location.reload();}
async function loadAll(){loadMembers();loadStats();}
async function loadStats(){
 const {count:all}=await sb.from('members').select('*',{count:'exact',head:true});
 const {count:pending}=await sb.from('members').select('*',{count:'exact',head:true}).eq('status','Pending');
 const {count:messages}=await sb.from('contact_messages').select('*',{count:'exact',head:true});
 document.getElementById('memberCount').textContent=all??0;document.getElementById('pendingCount').textContent=pending??0;document.getElementById('messageCount').textContent=messages??0;
}
async function loadMembers(){
 const {data,error}=await sb.from('members').select('id,application_number,full_name,phone,status,submitted_at').order('submitted_at',{ascending:false}).limit(100);
 const t=document.getElementById('members');if(error){t.innerHTML='<tr><td colspan="6">'+esc(error.message)+'</td></tr>';return;}
 t.innerHTML=data.map(x=>`<tr><td>${esc(x.application_number)}</td><td>${esc(x.full_name)}</td><td>${esc(x.phone)}</td><td>${esc(x.status)}</td><td>${new Date(x.submitted_at).toLocaleString()}</td><td><select onchange="setStatus('${x.id}',this.value)"><option>Change</option><option>Approved</option><option>Rejected</option><option>Inactive</option><option>Pending</option></select></td></tr>`).join('');
}
async function setStatus(id,status){
 const {data:{user}}=await sb.auth.getUser();
 const {error}=await sb.from('members').update({status,reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq('id',id);
 if(error)alert(error.message);else loadAll();
}
async function addNews(){
 const title=document.getElementById('newsTitle').value,summary=document.getElementById('newsSummary').value,body=document.getElementById('newsBody').value;
 const {error}=await sb.from('news').insert({title,summary,body,published:true,published_at:new Date().toISOString()});
 document.getElementById('newsMsg').textContent=error?error.message:'News published.';if(!error){document.getElementById('newsTitle').value='';document.getElementById('newsSummary').value='';document.getElementById('newsBody').value='';}
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
init().then(()=>sb&&check());
</script>
</body>
</html>
